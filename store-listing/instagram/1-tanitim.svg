<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0f1a"/>
      <stop offset="50%" stop-color="#0d1520"/>
      <stop offset="100%" stop-color="#0a1a12"/>
    </linearGradient>
  </defs>

  <rect width="1080" height="1080" fill="url(#bg1)"/>
  <circle cx="540" cy="540" r="400" fill="#00E676" opacity="0.03"/>

  <!-- Corner accents -->
  <line x1="30" y1="30" x2="90" y2="30" stroke="#00E676" stroke-width="2" opacity="0.5"/>
  <line x1="30" y1="30" x2="30" y2="90" stroke="#00E676" stroke-width="2" opacity="0.5"/>
  <line x1="1050" y1="30" x2="990" y2="30" stroke="#00E676" stroke-width="2" opacity="0.5"/>
  <line x1="1050" y1="30" x2="1050" y2="90" stroke="#00E676" stroke-width="2" opacity="0.5"/>
  <line x1="30" y1="1050" x2="90" y2="1050" stroke="#00E676" stroke-width="2" opacity="0.5"/>
  <line x1="30" y1="1050" x2="30" y2="990" stroke="#00E676" stroke-width="2" opacity="0.5"/>
  <line x1="1050" y1="1050" x2="990" y2="1050" stroke="#00E676" stroke-width="2" opacity="0.5"/>
  <line x1="1050" y1="1050" x2="1050" y2="990" stroke="#00E676" stroke-width="2" opacity="0.5"/>

  <!-- TrustEdge Labs -->
  <text x="540" y="80" text-anchor="middle" fill="#00E676" font-family="Arial, sans-serif" font-size="18" font-weight="bold" letter-spacing="6">TRUSTEDGE LABS</text>

  <!-- Main Title -->
  <text x="540" y="155" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="50" font-weight="bold">Gizliligin Artik</text>
  <text x="540" y="215" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="50" font-weight="bold">Senin Elinde</text>

  <!-- Subtitle -->
  <text x="540" y="270" text-anchor="middle" fill="#aaa" font-family="Arial, sans-serif" font-size="20">Gizlilik puanini ogren, tehditleri tespit et</text>

  <!-- Play Store card -->
  <rect x="290" y="970" width="500" height="60" rx="12" fill="#1a2332" stroke="#2a3a4a" stroke-width="1"/>
  <g transform="translate(315, 985)">
    <rect width="30" height="30" rx="6" fill="#00E676"/>
    <polygon points="11,7 11,23 24,15" fill="white"/>
  </g>
  <text x="360" y="998" fill="white" font-family="Arial, sans-serif" font-size="15" font-weight="bold">TrustGuard</text>
  <text x="360" y="1018" fill="#888" font-family="Arial" font-size="12">Yakin zamanda Google Play'de</text>
  <rect x="660" y="985" width="100" height="30" rx="15" fill="#00E676"/>
  <text x="710" y="1005" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Yakinda</text>
