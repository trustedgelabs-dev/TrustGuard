<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 820" width="400" height="820">
  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a2a2a"/>
      <stop offset="50%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#111111"/>
    </linearGradient>
    <filter id="phoneShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <g filter="url(#phoneShadow)">
    <!-- Phone body -->
    <rect x="20" y="10" width="360" height="800" rx="40" fill="url(#frame)" stroke="#444" stroke-width="2"/>

    <!-- Screen bezel -->
    <rect x="32" y="22" width="336" height="776" rx="32" fill="#222" stroke="#333" stroke-width="1"/>

    <!-- Screen area - transparent for screenshot placement -->
    <rect x="38" y="70" width="324" height="680" rx="4" fill="#0d1520"/>

    <!-- Top speaker/camera notch -->
    <rect x="155" y="35" width="90" height="6" rx="3" fill="#333"/>
    <circle cx="260" cy="38" r="5" fill="#222" stroke="#333" stroke-width="1"/>

    <!-- Bottom bar -->
    <rect x="150" y="770" width="100" height="5" rx="2.5" fill="#444"/>
  </g>
</svg>