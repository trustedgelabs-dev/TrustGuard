<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0f1a"/>
      <stop offset="50%" stop-color="#1a1508"/>
      <stop offset="100%" stop-color="#0a0f1a"/>
    </linearGradient>
  </defs>

  <rect width="1080" height="1080" fill="url(#bg4)"/>
  <circle cx="540" cy="540" r="400" fill="#FFC107" opacity="0.02"/>

  <!-- Corner accents -->
  <line x1="30" y1="30" x2="90" y2="30" stroke="#FFC107" stroke-width="2" opacity="0.5"/>
  <line x1="30" y1="30" x2="30" y2="90" stroke="#FFC107" stroke-width="2" opacity="0.5"/>
  <line x1="1050" y1="30" x2="990" y2="30" stroke="#FFC107" stroke-width="2" opacity="0.5"/>
  <line x1="1050" y1="30" x2="1050" y2="90" stroke="#FFC107" stroke-width="2" opacity="0.5"/>
  <line x1="30" y1="1050" x2="90" y2="1050" stroke="#FFC107" stroke-width="2" opacity="0.5"/>
  <line x1="30" y1="1050" x2="30" y2="990" stroke="#FFC107" stroke-width="2" opacity="0.5"/>
  <line x1="1050" y1="1050" x2="990" y2="1050" stroke="#FFC107" stroke-width="2" opacity="0.5"/>
  <line x1="1050" y1="1050" x2="1050" y2="990" stroke="#FFC107" stroke-width="2" opacity="0.5"/>

  <!-- Top badge -->
  <rect x="350" y="40" width="380" height="36" rx="18" fill="#2a2010" stroke="#FFC107" stroke-width="1"/>
  <text x="540" y="64" text-anchor="middle" fill="#FFC107" font-family="Arial" font-size="14" font-weight="bold">REKLAM TEHDIDI TESPITI</text>

  <!-- Main Title -->
  <text x="540" y="150" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="48" font-weight="bold">Telefonunda Gizlenen</text>
  <text x="540" y="210" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="48" font-weight="bold">Tehditler Var mi?</text>
  <text x="540" y="260" text-anchor="middle" fill="#FFC107" font-family="Arial, sans-serif" font-size="18">Supheli uygulamalari aninda tespit et</text>

  <!-- Play Store card -->
  <rect x="290" y="970" width="500" height="60" rx="12" fill="#1a2332" stroke="#2a3a4a" stroke-width="1"/>
  <g transform="translate(315, 985)">
    <rect width="30" height="30" rx="6" fill="#00E676"/>
    <polygon points="11,7 11,23 24,15" fill="white"/>
  </g>
  <text x="360" y="998" fill="white" font-family="Arial, sans-serif" font-size="15" font-weight="bold">TrustGuard</text>
  <text x="360" y="1018" fill="#888" font-family="Arial" font-size="12">Yakin zamanda Google Play'de</text>
  <rect x="660" y="985" width="100" height="30" rx="15" fill="#00E676"/>
  <text x="710" y="1005" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Yakinda</text>
</svg>