<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0D1B2A"/>
      <stop offset="100%" style="stop-color:#060E18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00E5FF"/>
      <stop offset="100%" style="stop-color:#00E676"/>
    </linearGradient>
    <linearGradient id="greenGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00E676" stop-opacity="0.3"/>
      <stop offset="100%" style="stop-color:#00BFA5" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <clipPath id="phoneClip">
      <rect x="90" y="280" width="900" height="1440" rx="20"/>
    </clipPath>
  </defs>

  <rect width="1080" height="1920" fill="url(#bg)"/>

  <text x="540" y="120" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="bold" fill="url(#accent)">Ad &amp; Tracker Blocking</text>
  <text x="540" y="175" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="30" fill="#9AA0A6">Block ads automatically with local DNS</text>
  <text x="540" y="225" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="26" fill="#6B7280">Yerel DNS ile reklamları otomatik engelle</text>

  <rect x="80" y="270" width="920" height="1460" rx="40" fill="#1A1A2E" stroke="#2A3A4A" stroke-width="3" filter="url(#shadow)"/>
  <rect x="90" y="280" width="900" height="40" fill="#0A0E14"/>
  <text x="540" y="307" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" fill="#9AA0A6">12:00</text>

  <g clip-path="url(#phoneClip)">
    <rect x="90" y="320" width="900" height="1400" fill="#0A0E14"/>

    <!-- Top bar -->
    <text x="540" y="375" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="bold" fill="#E8EAED">Ad &amp; Tracker Blocking</text>

    <!-- VPN Toggle Card - Active -->
    <rect x="120" y="410" width="840" height="160" rx="20" fill="#1E2A3A"/>
    <circle cx="540" cy="465" r="30" fill="url(#greenGlow)"/>
    <circle cx="540" cy="465" r="16" fill="#00E676"/>
    <text x="540" y="472" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" fill="#0A0E14">✓</text>
    <text x="540" y="510" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="bold" fill="#00E676">Protection Active</text>
    <text x="540" y="540" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" fill="#9AA0A6">Blocking ads and trackers on this device</text>

    <!-- Stats Cards -->
    <!-- Blocked Today -->
    <rect x="120" y="595" width="405" height="130" rx="16" fill="#1E2A3A"/>
    <text x="150" y="640" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" fill="#9AA0A6">Blocked Today</text>
    <text x="150" y="690" font-family="'Segoe UI', Roboto, sans-serif" font-size="48" font-weight="bold" fill="#00E676">1,247</text>

    <!-- Total Queries -->
    <rect x="555" y="595" width="405" height="130" rx="16" fill="#1E2A3A"/>
    <text x="585" y="640" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" fill="#9AA0A6">Total Queries Today</text>
    <text x="585" y="690" font-family="'Segoe UI', Roboto, sans-serif" font-size="48" font-weight="bold" fill="#E8EAED">4,892</text>

    <!-- Blocked All Time -->
    <rect x="120" y="745" width="840" height="80" rx="16" fill="#1E2A3A"/>
    <text x="150" y="785" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" fill="#9AA0A6">Blocked All Time</text>
    <text x="920" y="795" text-anchor="end" font-family="'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="bold" fill="#00BFA5">28,493</text>

    <!-- Most Blocked section -->
    <text x="130" y="875" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="bold" fill="#E8EAED">Most Blocked</text>

    <rect x="120" y="895" width="840" height="55" rx="10" fill="#1E2A3A"/>
    <text x="150" y="928" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" fill="#FF1744">graph.facebook.com</text>
    <text x="920" y="928" text-anchor="end" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" fill="#9AA0A6">342 blocks</text>

    <rect x="120" y="960" width="840" height="55" rx="10" fill="#1E2A3A"/>
    <text x="150" y="993" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" fill="#FF9800">ads.google.com</text>
    <text x="920" y="993" text-anchor="end" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" fill="#9AA0A6">287 blocks</text>

    <rect x="120" y="1025" width="840" height="55" rx="10" fill="#1E2A3A"/>
    <text x="150" y="1058" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" fill="#FF9800">analytics.tiktok.com</text>
    <text x="920" y="1058" text-anchor="end" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" fill="#9AA0A6">198 blocks</text>

    <rect x="120" y="1090" width="840" height="55" rx="10" fill="#1E2A3A"/>
    <text x="150" y="1123" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" fill="#FFD600">app-measurement.com</text>
    <text x="920" y="1123" text-anchor="end" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" fill="#9AA0A6">156 blocks</text>

    <!-- Blocklists section -->
    <text x="130" y="1200" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="bold" fill="#E8EAED">Blocklists</text>

    <!-- Ad domains -->
    <rect x="120" y="1220" width="840" height="75" rx="12" fill="#1E2A3A"/>
    <text x="155" y="1255" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" fill="#E8EAED">🚫  Ad Domains</text>
    <text x="155" y="1278" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" fill="#9AA0A6">52,841 domains</text>
    <!-- Toggle on -->
    <rect x="880" y="1243" width="50" height="28" rx="14" fill="#00E676"/>
    <circle cx="916" cy="1257" r="11" fill="white"/>

    <!-- Tracker domains -->
    <rect x="120" y="1310" width="840" height="75" rx="12" fill="#1E2A3A"/>
    <text x="155" y="1345" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" fill="#E8EAED">🔍  Tracker Domains</text>
    <text x="155" y="1368" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" fill="#9AA0A6">31,209 domains</text>
    <rect x="880" y="1333" width="50" height="28" rx="14" fill="#00E676"/>
    <circle cx="916" cy="1347" r="11" fill="white"/>

    <!-- Custom list -->
    <rect x="120" y="1400" width="840" height="75" rx="12" fill="#1E2A3A" stroke="#FFD700" stroke-width="1" opacity="0.7"/>
    <text x="155" y="1435" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" fill="#FFD700">💎  Custom Blocklists</text>
    <text x="155" y="1458" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" fill="#9AA0A6">Premium Required</text>
  </g>

  <text x="540" y="1810" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="bold" fill="#E8EAED">TrustGuard</text>
  <text x="540" y="1850" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" fill="#9AA0A6">by TrustEdge Labs</text>
</svg>
