<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0D1B2A"/>
      <stop offset="100%" style="stop-color:#060E18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF9800"/>
      <stop offset="100%" style="stop-color:#FF5722"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <clipPath id="phoneClip">
      <rect x="90" y="280" width="900" height="1440" rx="20"/>
    </clipPath>
  </defs>

  <rect width="1080" height="1920" fill="url(#bg)"/>

  <text x="540" y="120" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="bold" fill="url(#accent)">Adware Detection</text>
  <text x="540" y="175" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="30" fill="#9AA0A6">Detect hidden ad threats in apps</text>
  <text x="540" y="225" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="26" fill="#6B7280">Gizli reklam tehditlerini tespit edin</text>

  <rect x="80" y="270" width="920" height="1460" rx="40" fill="#1A1A2E" stroke="#2A3A4A" stroke-width="3" filter="url(#shadow)"/>
  <rect x="90" y="280" width="900" height="40" fill="#0A0E14"/>
  <text x="540" y="307" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" fill="#9AA0A6">12:00</text>

  <g clip-path="url(#phoneClip)">
    <rect x="90" y="320" width="900" height="1400" fill="#0A0E14"/>

    <!-- Top bar -->
    <text x="130" y="375" font-family="'Segoe UI', Roboto, sans-serif" font-size="28" fill="#E8EAED">←</text>
    <text x="540" y="375" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="bold" fill="#E8EAED">Ad Threat Scan</text>

    <!-- Alert banner -->
    <rect x="120" y="405" width="840" height="70" rx="16" fill="#FF9800" opacity="0.15"/>
    <text x="540" y="445" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="bold" fill="#FF9800">⚠️  3 suspicious app(s) found</text>

    <!-- Suspicious App 1 - Highly Suspicious -->
    <rect x="120" y="500" width="840" height="310" rx="16" fill="#1E2A3A"/>
    <!-- Header -->
    <circle cx="170" cy="545" r="28" fill="#FF1744" opacity="0.2"/>
    <text x="170" y="553" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="24">🧹</text>
    <text x="215" y="538" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="bold" fill="#E8EAED">Super Cleaner Pro</text>
    <text x="215" y="562" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" fill="#9AA0A6">com.super.cleaner.pro</text>
    <rect x="770" y="525" width="160" height="30" rx="15" fill="#FF1744" opacity="0.2"/>
    <text x="850" y="545" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#FF1744">Highly Suspicious</text>

    <!-- Score bar -->
    <text x="150" y="605" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" fill="#9AA0A6">Suspicion: 85%</text>
    <rect x="150" y="615" width="780" height="8" rx="4" fill="#2A3A4A"/>
    <rect x="150" y="615" width="663" height="8" rx="4" fill="#FF1744"/>

    <!-- Reasons -->
    <text x="165" y="655" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" fill="#FF9800">⚠ Can display ads over other apps</text>
    <text x="165" y="682" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" fill="#FF9800">⚠ Starts automatically on boot</text>
    <text x="165" y="709" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" fill="#FF9800">⚠ Contains aggressive ad SDK</text>
    <text x="165" y="736" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" fill="#FF9800">⚠ Suspicious permission combo</text>

    <!-- Action buttons -->
    <rect x="150" y="760" width="180" height="36" rx="18" fill="#FF1744" opacity="0.2"/>
    <text x="240" y="783" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#FF1744">Uninstall</text>
    <rect x="350" y="760" width="180" height="36" rx="18" fill="#1E2A3A" stroke="#9AA0A6" stroke-width="1"/>
    <text x="440" y="783" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" fill="#9AA0A6">App Settings</text>

    <!-- Suspicious App 2 -->
    <rect x="120" y="835" width="840" height="200" rx="16" fill="#1E2A3A"/>
    <circle cx="170" cy="880" r="28" fill="#FF9800" opacity="0.2"/>
    <text x="170" y="888" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="24">🔦</text>
    <text x="215" y="873" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="bold" fill="#E8EAED">Flashlight Ultra</text>
    <text x="215" y="897" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" fill="#9AA0A6">com.flashlight.ultra.free</text>
    <rect x="800" y="860" width="130" height="30" rx="15" fill="#FF9800" opacity="0.2"/>
    <text x="865" y="880" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#FF9800">Suspicious</text>

    <text x="150" y="940" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" fill="#9AA0A6">Suspicion: 55%</text>
    <rect x="150" y="950" width="780" height="8" rx="4" fill="#2A3A4A"/>
    <rect x="150" y="950" width="429" height="8" rx="4" fill="#FF9800"/>

    <text x="165" y="990" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" fill="#FF9800">⚠ Can display ads over other apps</text>
    <text x="165" y="1017" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" fill="#FF9800">⚠ Suspicious permission combo</text>

    <!-- Tips Card -->
    <rect x="120" y="1060" width="840" height="200" rx="16" fill="#131A24" stroke="#00BFA5" stroke-width="1"/>
    <text x="155" y="1100" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="bold" fill="#00BFA5">💡 What can you do?</text>

    <text x="170" y="1140" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" fill="#E8EAED">1. Uninstall the app if you don't need it</text>
    <text x="170" y="1175" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" fill="#E8EAED">2. Revoke overlay permission from Settings</text>
    <text x="170" y="1210" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" fill="#E8EAED">3. Restrict background activity</text>
  </g>

  <text x="540" y="1810" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="bold" fill="#E8EAED">TrustGuard</text>
  <text x="540" y="1850" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" fill="#9AA0A6">by TrustEdge Labs</text>
</svg>
