<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0D1B2A"/>
      <stop offset="100%" style="stop-color:#060E18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00E5FF"/>
      <stop offset="100%" style="stop-color:#00E676"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1E2A3A"/>
      <stop offset="100%" style="stop-color:#131A24"/>
    </linearGradient>
    <linearGradient id="scoreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00E5FF"/>
      <stop offset="50%" style="stop-color:#00BFA5"/>
      <stop offset="100%" style="stop-color:#00E676"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <clipPath id="phoneClip">
      <rect x="90" y="280" width="900" height="1440" rx="20"/>
    </clipPath>
  </defs>

  <!-- Full background -->
  <rect width="1080" height="1920" fill="url(#bg)"/>

  <!-- Top caption area -->
  <text x="540" y="120" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="bold" fill="url(#accent)">Privacy Score</text>
  <text x="540" y="175" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="30" fill="#9AA0A6">Your device security at a glance</text>
  <text x="540" y="225" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="26" fill="#6B7280">Cihaz güvenliğiniz bir bakışta</text>

  <!-- Phone frame -->
  <rect x="80" y="270" width="920" height="1460" rx="40" fill="#1A1A2E" stroke="#2A3A4A" stroke-width="3" filter="url(#shadow)"/>

  <!-- Status bar -->
  <rect x="90" y="280" width="900" height="40" fill="#0A0E14"/>
  <text x="540" y="307" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" fill="#9AA0A6">12:00</text>

  <!-- App screen content -->
  <g clip-path="url(#phoneClip)">
    <!-- Screen bg -->
    <rect x="90" y="320" width="900" height="1400" fill="#0A0E14"/>

    <!-- Top bar -->
    <rect x="90" y="320" width="900" height="70" fill="#0A0E14"/>
    <text x="540" y="365" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="bold" fill="#E8EAED">Security Dashboard</text>

    <!-- Score circle area -->
    <circle cx="540" cy="560" r="120" fill="none" stroke="#1E2A3A" stroke-width="12"/>
    <circle cx="540" cy="560" r="120" fill="none" stroke="url(#scoreGrad)" stroke-width="12" stroke-dasharray="620 755" stroke-linecap="round" transform="rotate(-90 540 560)"/>
    <text x="540" y="550" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="bold" fill="#00E676">82</text>
    <text x="540" y="590" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" fill="#9AA0A6">Privacy Score</text>
    <text x="540" y="715" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" fill="#6B7280">47 apps analyzed</text>

    <!-- Top Risks section -->
    <text x="130" y="785" font-family="'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="bold" fill="#E8EAED">Most Permission Requests</text>
    <text x="920" y="785" text-anchor="end" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" fill="#00BFA5">View All</text>

    <!-- Risk app cards -->
    <!-- Card 1 -->
    <rect x="120" y="810" width="840" height="80" rx="16" fill="#1E2A3A"/>
    <circle cx="170" cy="850" r="24" fill="#FF1744" opacity="0.2"/>
    <text x="170" y="856" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" fill="#FF1744">📷</text>
    <text x="210" y="842" font-family="'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="600" fill="#E8EAED">Instagram</text>
    <text x="210" y="868" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" fill="#9AA0A6">24 permissions (8 sensitive)</text>
    <rect x="830" y="835" width="100" height="30" rx="15" fill="#FF1744" opacity="0.15"/>
    <text x="880" y="855" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#FF1744">Sensitive</text>

    <!-- Card 2 -->
    <rect x="120" y="905" width="840" height="80" rx="16" fill="#1E2A3A"/>
    <circle cx="170" cy="945" r="24" fill="#FFD600" opacity="0.2"/>
    <text x="170" y="951" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" fill="#FFD600">💬</text>
    <text x="210" y="937" font-family="'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="600" fill="#E8EAED">WhatsApp</text>
    <text x="210" y="963" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" fill="#9AA0A6">18 permissions (5 sensitive)</text>
    <rect x="830" y="930" width="100" height="30" rx="15" fill="#FFD600" opacity="0.15"/>
    <text x="880" y="950" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#FFD600">Moderate</text>

    <!-- Card 3 -->
    <rect x="120" y="1000" width="840" height="80" rx="16" fill="#1E2A3A"/>
    <circle cx="170" cy="1040" r="24" fill="#FF1744" opacity="0.2"/>
    <text x="170" y="1046" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" fill="#FF1744">📍</text>
    <text x="210" y="1032" font-family="'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="600" fill="#E8EAED">Google Maps</text>
    <text x="210" y="1058" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" fill="#9AA0A6">22 permissions (7 sensitive)</text>
    <rect x="830" y="1025" width="100" height="30" rx="15" fill="#FF1744" opacity="0.15"/>
    <text x="880" y="1045" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#FF1744">Sensitive</text>

    <!-- Feature cards row -->
    <!-- Ad Blocking Card -->
    <rect x="120" y="1120" width="405" height="140" rx="16" fill="#1E2A3A"/>
    <text x="150" y="1160" font-family="'Segoe UI', Roboto, sans-serif" font-size="28" fill="#00BFA5">🚫</text>
    <text x="190" y="1160" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="bold" fill="#E8EAED">Ad Blocking</text>
    <text x="150" y="1190" font-family="'Segoe UI', Roboto, sans-serif" font-size="36" font-weight="bold" fill="#00E676">247</text>
    <text x="150" y="1215" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" fill="#9AA0A6">blocked today</text>
    <rect x="150" y="1230" width="120" height="6" rx="3" fill="#1A3A2A"/>
    <rect x="150" y="1230" width="90" height="6" rx="3" fill="#00E676"/>

    <!-- File Recovery Card -->
    <rect x="555" y="1120" width="405" height="140" rx="16" fill="#1E2A3A"/>
    <text x="585" y="1160" font-family="'Segoe UI', Roboto, sans-serif" font-size="28" fill="#00E5FF">📁</text>
    <text x="625" y="1160" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="bold" fill="#E8EAED">File Recovery</text>
    <text x="585" y="1195" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" fill="#9AA0A6">Recover deleted</text>
    <text x="585" y="1215" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" fill="#9AA0A6">photos &amp; files</text>

    <!-- Adware Card -->
    <rect x="120" y="1280" width="405" height="140" rx="16" fill="#1E2A3A"/>
    <text x="150" y="1320" font-family="'Segoe UI', Roboto, sans-serif" font-size="28" fill="#FF9800">🔎</text>
    <text x="190" y="1320" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="bold" fill="#E8EAED">Ad Threats</text>
    <text x="150" y="1355" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" fill="#9AA0A6">Detect suspicious</text>
    <text x="150" y="1375" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" fill="#9AA0A6">ad behavior</text>

    <!-- Premium Card -->
    <rect x="555" y="1280" width="405" height="140" rx="16" fill="#1E2A3A" stroke="#FFD700" stroke-width="1" opacity="0.9"/>
    <text x="585" y="1320" font-family="'Segoe UI', Roboto, sans-serif" font-size="28" fill="#FFD700">💎</text>
    <text x="625" y="1320" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="bold" fill="#FFD700">Go Premium</text>
    <text x="585" y="1355" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" fill="#9AA0A6">Unlimited recovery</text>
    <text x="585" y="1375" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" fill="#9AA0A6">&amp; advanced features</text>

    <!-- Bottom nav -->
    <rect x="90" y="1630" width="900" height="90" fill="#131A24"/>
    <text x="230" y="1680" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" fill="#00E676">Dashboard</text>
    <text x="430" y="1680" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" fill="#9AA0A6">Apps</text>
    <text x="630" y="1680" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" fill="#9AA0A6">Protection</text>
    <text x="830" y="1680" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" fill="#9AA0A6">Settings</text>

    <!-- Nav icons -->
    <text x="230" y="1658" text-anchor="middle" font-size="22">🛡️</text>
    <text x="430" y="1658" text-anchor="middle" font-size="22">📱</text>
    <text x="630" y="1658" text-anchor="middle" font-size="22">🚫</text>
    <text x="830" y="1658" text-anchor="middle" font-size="22">⚙️</text>
  </g>

  <!-- Bottom caption -->
  <text x="540" y="1810" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="bold" fill="#E8EAED">TrustGuard</text>
  <text x="540" y="1850" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" fill="#9AA0A6">by TrustEdge Labs</text>
</svg>
