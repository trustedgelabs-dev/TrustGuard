<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D1B2A"/>
      <stop offset="50%" style="stop-color:#0A1628"/>
      <stop offset="100%" style="stop-color:#060E18"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00E5FF"/>
      <stop offset="50%" style="stop-color:#00BFA5"/>
      <stop offset="100%" style="stop-color:#00E676"/>
    </linearGradient>
    <linearGradient id="innerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D2137"/>
      <stop offset="50%" style="stop-color:#0A1929"/>
      <stop offset="100%" style="stop-color:#071420"/>
    </linearGradient>
    <linearGradient id="irisGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00E5FF"/>
      <stop offset="100%" style="stop-color:#00E676"/>
    </linearGradient>
    <clipPath id="roundClip">
      <circle cx="256" cy="256" r="256"/>
    </clipPath>
  </defs>

  <!-- Round background (Play Store icon shape) -->
  <circle cx="256" cy="256" r="256" fill="url(#bgGrad)"/>

  <!-- Subtle radial glow -->
  <circle cx="256" cy="256" r="213" fill="#00E676" opacity="0.03"/>

  <!-- Grid lines for tech feel -->
  <g opacity="0.03" stroke="#FFFFFF" stroke-width="1" fill="none" clip-path="url(#roundClip)">
    <line x1="0" y1="128" x2="512" y2="128"/>
    <line x1="0" y1="256" x2="512" y2="256"/>
    <line x1="0" y1="384" x2="512" y2="384"/>
    <line x1="128" y1="0" x2="128" y2="512"/>
    <line x1="256" y1="0" x2="256" y2="512"/>
    <line x1="384" y1="0" x2="384" y2="512"/>
  </g>

  <!-- Corner dots -->
  <circle cx="85" cy="85" r="5" fill="#00E676" opacity="0.08"/>
  <circle cx="427" cy="85" r="5" fill="#00E676" opacity="0.08"/>
  <circle cx="85" cy="427" r="5" fill="#00E676" opacity="0.08"/>
  <circle cx="427" cy="427" r="5" fill="#00E676" opacity="0.08"/>

  <!-- === FOREGROUND: Shield + Eye (scaled from 108 viewport to 512) === -->
  <g transform="translate(256,256) scale(4.74) translate(-54,-54)">

    <!-- Main Shield Shape -->
    <path d="M54,22L30,32v15c0,16.65 11.52,32.22 24,34.8 12.48,-2.58 24,-18.15 24,-34.8V32L54,22z" fill="url(#shieldGrad)"/>

    <!-- Inner shield darker area -->
    <path d="M54,26L34,34.5v12.5c0,13.85 9.6,26.85 20,29 10.4,-2.15 20,-15.15 20,-29V34.5L54,26z" fill="url(#innerGrad)"/>

    <!-- Eye outer shape -->
    <path d="M54,44c-8.8,0 -16.4,5 -20,12 3.6,7 11.2,12 20,12 8.8,0 16.4,-5 20,-12 -3.6,-7 -11.2,-12 -20,-12zM54,64c-4.42,0 -8,-3.58 -8,-8s3.58,-8 8,-8 8,3.58 8,8 -3.58,8 -8,8z" fill="#00E676"/>

    <!-- Eye iris/pupil -->
    <path d="M54,51c-2.76,0 -5,2.24 -5,5s2.24,5 5,5 5,-2.24 5,-5 -2.24,-5 -5,-5z" fill="url(#irisGrad)"/>

    <!-- Light reflection -->
    <circle cx="52.5" cy="53.5" r="1.5" fill="white" opacity="0.67"/>

    <!-- Shield highlight -->
    <path d="M54,22L30,32v3l24,-10 24,10v-3L54,22z" fill="white" opacity="0.2"/>

  </g>
</svg>
