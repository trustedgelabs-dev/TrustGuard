<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap');

  body {
    width: 1080px;
    height: 1080px;
    font-family: 'Inter', sans-serif;
    background: #0A0E14;
    color: white;
    overflow: hidden;
    position: relative;
  }

  .bg-glow {
    position: absolute;
    border-radius: 50%;
    filter: blur(120px);
  }
  .g1 { width: 600px; height: 600px; top: -200px; right: -100px; background: rgba(0,230,118,0.2); }
  .g2 { width: 500px; height: 500px; bottom: -150px; left: -100px; background: rgba(0,188,212,0.15); }

  .content {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    padding: 60px;
  }

  .header-row {
    display: flex;
    align-items: center;
    gap: 18px;
    margin-bottom: 40px;
  }

  .logo-box {
    width: 64px;
    height: 64px;
    background: linear-gradient(135deg, #00E676, #00C853);
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .logo-box svg { width: 38px; height: 38px; fill: #0A0E14; }

  .brand-name {
    font-size: 34px;
    font-weight: 800;
    color: #00E676;
  }

  h1 {
    font-size: 68px;
    font-weight: 900;
    text-align: center;
    line-height: 1.15;
    margin-bottom: 20px;
  }
  h1 .green { color: #00E676; }

  .sub {
    font-size: 30px;
    color: rgba(255,255,255,0.55);
    text-align: center;
    margin-bottom: 50px;
    line-height: 1.4;
  }

  .features-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    width: 100%;
    margin-bottom: 50px;
  }

  .feat {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 20px;
    padding: 24px 16px;
    text-align: center;
  }

  .feat-icon { font-size: 40px; margin-bottom: 10px; }
  .feat-label { font-size: 22px; font-weight: 600; color: rgba(255,255,255,0.8); line-height: 1.2; }

  .cta {
    background: linear-gradient(135deg, #00E676, #00C853);
    border-radius: 50px;
    padding: 24px 60px;
    font-size: 32px;
    font-weight: 800;
    color: #0A0E14;
    box-shadow: 0 8px 32px rgba(0,230,118,0.35);
  }

  .url {
    font-size: 22px;
    color: rgba(255,255,255,0.3);
    margin-top: 18px;
    letter-spacing: 1px;
  }
</style>
</head>
<body>
  <div class="bg-glow g1"></div>
  <div class="bg-glow g2"></div>

  <div class="content">
    <div class="header-row">
      <div class="logo-box">
        <svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"/></svg>
      </div>
      <span class="brand-name">TrustGuard</span>
    </div>

    <h1>Dijital G&#252;venli&#287;in<br><span class="green">Tam Kontrol&#252;</span></h1>

    <p class="sub">Reklam engelleme, firewall, &#351;ifreli kasa<br>ve daha fazlas&#305; tek uygulamada.</p>

    <div class="features-row">
      <div class="feat">
        <div class="feat-icon">&#128737;&#65039;</div>
        <div class="feat-label">VPN<br>Koruma</div>
      </div>
      <div class="feat">
        <div class="feat-icon">&#128293;</div>
        <div class="feat-label">Uygulama<br>Firewall</div>
      </div>
      <div class="feat">
        <div class="feat-icon">&#128274;</div>
        <div class="feat-label">&#350;ifreli<br>Kasa</div>
      </div>
      <div class="feat">
        <div class="feat-icon">&#128065;&#65039;</div>
        <div class="feat-label">Gizlilik<br>Paneli</div>
      </div>
    </div>

    <div class="cta">&#220;CRETS&#304;Z &#304;ND&#304;R</div>
    <div class="url">trustedgelabs.dev</div>
  </div>
</body>
</html>
