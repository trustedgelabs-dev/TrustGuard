<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1920">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap');

  body {
    width: 1080px;
    height: 1920px;
    font-family: 'Inter', sans-serif;
    background: #0A0E14;
    color: white;
    overflow: hidden;
    position: relative;
  }

  /* Animated gradient bg */
  .bg-glow {
    position: absolute;
    width: 800px;
    height: 800px;
    border-radius: 50%;
    filter: blur(150px);
    opacity: 0.3;
  }
  .glow-1 { top: -200px; left: -200px; background: #00E676; }
  .glow-2 { bottom: -100px; right: -200px; background: #00BCD4; }
  .glow-3 { top: 50%; left: 50%; transform: translate(-50%,-50%); background: #1B5E20; width: 600px; height: 600px; }

  .content {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    height: 100%;
    padding: 80px 60px;
  }

  .top-badge {
    background: rgba(0,230,118,0.15);
    border: 2px solid #00E676;
    border-radius: 50px;
    padding: 14px 40px;
    font-size: 28px;
    font-weight: 700;
    color: #00E676;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 60px;
  }

  .shield-icon {
    width: 220px;
    height: 220px;
    background: linear-gradient(135deg, #00E676, #00C853);
    border-radius: 50px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 60px;
    box-shadow: 0 0 80px rgba(0,230,118,0.4), 0 20px 60px rgba(0,0,0,0.5);
  }

  .shield-icon svg {
    width: 130px;
    height: 130px;
    fill: #0A0E14;
  }

  h1 {
    font-size: 72px;
    font-weight: 900;
    text-align: center;
    line-height: 1.1;
    margin-bottom: 30px;
    background: linear-gradient(to right, #fff, #B2FF59);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .subtitle {
    font-size: 36px;
    color: rgba(255,255,255,0.7);
    text-align: center;
    line-height: 1.4;
    margin-bottom: 60px;
    max-width: 800px;
  }

  .features {
    display: flex;
    flex-direction: column;
    gap: 24px;
    width: 100%;
    margin-bottom: auto;
  }

  .feature-row {
    display: flex;
    align-items: center;
    gap: 20px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 20px;
    padding: 24px 30px;
  }

  .feature-icon {
    width: 56px;
    height: 56px;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    flex-shrink: 0;
  }

  .feature-text {
    font-size: 32px;
    font-weight: 600;
    color: rgba(255,255,255,0.9);
  }

  .download-btn {
    background: linear-gradient(135deg, #00E676, #00C853);
    border-radius: 60px;
    padding: 30px 80px;
    font-size: 36px;
    font-weight: 800;
    color: #0A0E14;
    text-align: center;
    margin-top: 50px;
    box-shadow: 0 10px 40px rgba(0,230,118,0.4);
    letter-spacing: 1px;
  }

  .bottom-url {
    font-size: 26px;
    color: rgba(255,255,255,0.4);
    margin-top: 30px;
    letter-spacing: 2px;
  }
</style>
</head>
<body>
  <div class="bg-glow glow-1"></div>
  <div class="bg-glow glow-2"></div>
  <div class="bg-glow glow-3"></div>

  <div class="content">
    <div class="top-badge">v3.0 YEN&#304;</div>

    <div class="shield-icon">
      <svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/></svg>
    </div>

    <h1>Telefonunu<br>Ger&#231;ekten Koru</h1>

    <p class="subtitle">Google'&#305;n kald&#305;rd&#305;&#287;&#305; g&#252;venlik &#246;zellikleri geri d&#246;nd&#252;.</p>

    <div class="features">
      <div class="feature-row">
        <div class="feature-icon" style="background: rgba(0,230,118,0.15);">&#128737;&#65039;</div>
        <span class="feature-text">VPN + Reklam Engelleyici</span>
      </div>
      <div class="feature-row">
        <div class="feature-icon" style="background: rgba(244,67,54,0.15);">&#128293;</div>
        <span class="feature-text">Uygulama Bazl&#305; Firewall</span>
      </div>
      <div class="feature-row">
        <div class="feature-icon" style="background: rgba(156,39,176,0.15);">&#128274;</div>
        <span class="feature-text">AES-256 &#350;ifreli Kasa</span>
      </div>
      <div class="feature-row">
        <div class="feature-icon" style="background: rgba(255,152,0,0.15);">&#128373;&#65039;</div>
        <span class="feature-text">Vir&#252;s Taray&#305;c&#305;</span>
      </div>
    </div>

    <div class="download-btn">&#220;CRETS&#304;Z &#304;ND&#304;R</div>
    <div class="bottom-url">trustedgelabs.dev</div>
  </div>
</body>
</html>
